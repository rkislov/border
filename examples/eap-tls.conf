# wpa_supplicant / eapol_test example. Replace all paths and the server DNS name.
network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="anonymous"
    ca_cert="/etc/border/server-ca.pem"
    domain_suffix_match="radius.example.net"
    client_cert="/etc/border/user-cert-chain.pem"
    private_key="/etc/border/user.key"
    fragment_size=1000
    phase1="tls_disable_tlsv1_3=1"
}
