<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Border · Гостевой Wi-Fi</title><link rel="stylesheet" href="style.css"><script defer src="guest.js"></script></head><body><header><b>◈ BORDER</b><span>Гостевой Wi-Fi</span></header><main class="portal-stage" id="portal-stage"><section id="login" class="portal-card"><p class="eyebrow">ПОДКЛЮЧЕНИЕ К СЕТИ</p><h1 id="portal-title">Подключение к сети</h1><p id="portal-description">Получите SMS-код для доступа этого устройства к сети. Номер используется для проверки подключения.</p><div id="method-choice" class="portal-methods" hidden aria-label="Способ входа"></div><div id="notice" role="status" hidden></div><form id="phone-form" class="portal-form" hidden><label><span id="contact-label">Номер телефона</span><input name="Contact" type="tel" required autocomplete="tel" placeholder="+79991234567"></label><button>Получить SMS-код</button></form><form id="code-form" class="portal-form" hidden><label><span id="code-label">Код подтверждения</span><input name="Code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><button>Подключиться</button></form><button id="method-back" type="button" hidden>Другой способ входа</button><button id="contact-back" type="button" hidden>Изменить телефон или email</button><p id="expiry" class="muted"></p></section></main><footer>Кислов Роман Сергеевич · Apache 2.0</footer></body></html>
